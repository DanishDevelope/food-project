<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register - Food App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed; 
            background-size: cover;
            display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; padding: 20px;
        }
        body::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(2px); z-index: 1;
        }
        .main-card {
            position: relative; z-index: 2; width: 900px;
            background: rgba(18, 18, 18, 0.95); border-radius: 16px; display: flex;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8); overflow: hidden; border: 1px solid #333;
        }
        .left-side {
            flex: 1.1; background: #181818; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
        }
        .logo-area { font-size: 26px; font-weight: bold; color: white; display: flex; align-items: center; gap: 5px; }
        .logo-area span { color: #ff5e62; }
        .food-showcase {
            text-align: center; margin: auto;
        }
        .food-showcase img {
            max-width: 280px; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
        }
        .right-side {
            flex: 1.1; padding: 35px 40px; display: flex; flex-direction: column; justify-content: center; background: #161616;
        }
        h2 { color: white; margin-bottom: 15px; font-size: 22px; text-align: center; font-weight: 600; }
        
        .input-container {
            display: flex; align-items: center; background: #1e1e1e; border: 1px solid #333; border-radius: 6px; overflow: hidden; margin-bottom: 10px;
        }
        .input-container:focus-within { border-color: #ff5e62; }
        .icon-box {
            padding: 0 12px; color: #777; background: #181818; height: 38px; display: flex; align-items: center; border-right: 1px solid #333; font-size: 13px;
        }
        .input-container input, .input-container select, .input-container textarea {
            flex: 1; background: transparent; border: none; padding: 8px 12px; color: white; font-size: 13px; outline: none; width: 100%;
        }
        .input-container select option { background: #1e1e1e; color: white; }
        
        .eye-box {
            padding: 0 12px; background: #222; height: 38px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: #777; border-left: 1px solid #333; transition: 0.2s;
        }
        .eye-box:hover { color: white; background: #2a2a2a; }

        .btn-submit {
            width: 100%; padding: 10px; background: #ff5e62; border: none; border-radius: 6px; color: white; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 5px;
        }
        .btn-submit:hover { background: #e04b50; }
        .bottom-text { margin-top: 12px; text-align: center; color: #888; font-size: 12px; }
        .bottom-text a { color: #ff5e62; text-decoration: none; font-weight: bold; }
        .error-msg { color: #ff4d4d; margin-bottom: 10px; font-size: 12px; text-align: center; }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="left-side">
            <div class="logo-area">food<span>.</span></div>
            <div class="food-showcase">
                <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?q=80&w=600&auto=format&fit=crop" alt="Delicious Food">
            </div>
        </div>
        <div class="right-side">
            <h2>Register</h2>
            {% if error %}
                <div class="error-msg">{{ error }}</div>
            {% endif %}
            <form method="POST">
                {% csrf_token %}
                
                <div class="input-container">
                    <div class="icon-box"><i class="fa-solid fa-user"></i></div>
                    <input type="text" name="username" placeholder="Username" autocomplete="off" required>
                </div>
                
                <div class="input-container">
                    <div class="icon-box"><i class="fa-solid fa-envelope"></i></div>
                    <input type="email" name="email" placeholder="Email Address" autocomplete="off" required>
                </div>
                
                <div class="input-container">
                    <div class="icon-box"><i class="fa-solid fa-lock"></i></div>
                    <input type="password" name="password" id="reg-password" placeholder="Password" autocomplete="new-password" required>
                    <div class="eye-box" id="toggleRegPassword">
                        <i class="fa-solid fa-eye" id="regEyeIcon"></i>
                    </div>
                </div>

                <div class="input-container">
                    <div class="icon-box"><i class="fa-solid fa-user-tag"></i></div>
                    <select name="role" id="roleSelect" required>
                        <option value="">Select Role</option>
                        <option value="Customer">Customer</option>
                        <option value="seller">seller</option>
                    </select>
                </div>

                <div class="input-container">
                    <div class="icon-box"><i class="fa-solid fa-phone"></i></div>
                    <input type="text" name="phone" placeholder="Phone Number" autocomplete="off">
                </div>

                <!-- Address Field (By default hidden, visible only for Customer) -->
                <div class="input-container" id="addressContainer" style="display: none; align-items: flex-start;">
                    <div class="icon-box" style="height: 50px;"><i class="fa-solid fa-location-dot"></i></div>
                    <textarea name="address" placeholder="Delivery Address" rows="2" autocomplete="off" style="resize: none; padding-top: 8px;"></textarea>
                </div>

                <button type="submit" class="btn-submit">Sign Up</button>
            </form>
            <div class="bottom-text">
                Already have an account? <a href="{% url 'login_url' %}">Login here</a>
            </div>
        </div>
    </div>

    <script>
        // Password toggle
        const toggleRegPassword = document.querySelector('#toggleRegPassword');
        const regPassword = document.querySelector('#reg-password');
        const regEyeIcon = document.querySelector('#regEyeIcon');

        toggleRegPassword.addEventListener('click', function () {
            const type = regPassword.getAttribute('type') === 'password' ? 'text' : 'password';
            regPassword.setAttribute('type', type);
            regEyeIcon.classList.toggle('fa-eye');
            regEyeIcon.classList.toggle('fa-eye-slash');
        });

        // Role change par address hide/show karne ka logic
        const roleSelect = document.getElementById('roleSelect');
        const addressContainer = document.getElementById('addressContainer');

        roleSelect.addEventListener('change', function() {
            if (this.value === 'Customer') {
                addressContainer.style.display = 'flex';
            } else {
                addressContainer.style.display = 'none';
                addressContainer.querySelector('textarea').value = ''; // clear value if hidden
            }
        });
    </script>
</body>
</html>
